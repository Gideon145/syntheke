[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
ffi = false
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
xlayer_testnet = "${XLAYER_RPC_URL}"
xlayer_mainnet = "https://rpc.xlayer.tech"
anvil = "http://localhost:8545"

[etherscan]
xlayer_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://testnet-explorer.xlayer.tech/api" }
xlayer_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.xlayer.tech/api" }

[fuzz]
runs = 5000
max_test_rejects = 1000000

[invariant]
runs = 256
depth = 15
