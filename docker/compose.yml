version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syntheke
      POSTGRES_PASSWORD: syntheke
      POSTGRES_DB: syntheke
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntheke"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: >
      anvil
      --host 0.0.0.0
      --port 8545
      --chain-id 1952
      --block-time 2
      --balance 10000
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8545"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
